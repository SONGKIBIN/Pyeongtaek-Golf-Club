*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Work Sans', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.font-display{
  font-family:'Fraunces', 'Work Sans', serif;
  text-wrap:balance;
  letter-spacing:-0.01em;
}
.mono, .num{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }
button{ font-family:inherit; }
a{ color:inherit; }
::selection{ background:var(--gold-tint); }
:focus-visible{ outline:2px solid var(--fairway); outline-offset:2px; }

#app{ min-height:100vh; display:flex; flex-direction:column; }

/* ---------- Login ---------- */
.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(1200px 600px at 20% -10%, var(--pine-tint), transparent 60%),
    var(--bg);
}
.login-card{
  width:100%;
  max-width:400px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-l);
  box-shadow:var(--shadow-card);
  padding:36px 32px 30px;
}
.login-crest{
  width:56px;height:56px;border-radius:16px;
  background:var(--pine);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  color:var(--gold-tint);
  font-family:'Fraunces',serif;
  font-weight:700;font-size:12px;letter-spacing:-0.02em;
  margin-bottom:18px;
  box-shadow:0 4px 14px -4px rgba(30,70,52,0.5);
  line-height:1;
}
.login-crest .flagmark{ font-size:14px; line-height:1; margin-top:1px; }
.crest .flagmark{ font-size:15px; line-height:1; }
.login-card h1{ font-size:26px; margin:0 0 4px; color:var(--pine); }
.login-card .sub{ color:var(--ink-soft); font-size:13.5px; margin:0 0 26px; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; letter-spacing:.01em; }
.field input, .field select, .field textarea{
  width:100%; padding:11px 13px; border:1px solid var(--border); border-radius:var(--radius-s);
  background:var(--surface); color:var(--ink); font-size:15px; font-family:inherit;
}
.field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--fairway); }
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:11px 18px; border-radius:var(--radius-s); border:1px solid transparent;
  font-size:14.5px; font-weight:600; cursor:pointer; transition:filter .12s, transform .05s;
  white-space:nowrap;
}
.btn:active{ transform:translateY(1px); }
.btn-primary{ background:var(--pine); color:#fff; }
.btn-primary:hover{ filter:brightness(1.1); }
.btn-gold{ background:var(--gold); color:#2A1F08; }
.btn-ghost{ background:transparent; color:var(--pine); border-color:var(--border); }
.btn-ghost:hover{ background:var(--surface-2); }
.btn-danger{ background:transparent; color:var(--alert); border-color:var(--alert-tint); }
.btn-danger:hover{ background:var(--alert-tint); }
.btn-block{ width:100%; }
.btn-sm{ padding:6px 11px; font-size:13px; border-radius:var(--radius-s); }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }
.login-hint{
  margin-top:18px; padding:12px 14px; background:var(--surface-2); border-radius:var(--radius-s);
  font-size:12.5px; color:var(--ink-soft); border:1px dashed var(--border);
}
.error-text{ color:var(--alert); font-size:13px; margin-top:10px; }

/* ---------- App shell ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--pine); color:#fff;
  display:flex; align-items:center; gap:12px;
  padding:12px 18px;
}
.topbar .crest{
  width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:17px;
}
.topbar .club-name{ font-family:'Fraunces',serif; font-weight:600; font-size:18px; margin-right:auto; }
.topbar .who{ font-size:13px; opacity:.92; text-align:right; line-height:1.3; }
.topbar .who b{ font-weight:600; }
.icon-btn{
  width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;position:relative;
}
.icon-btn:hover{ background:rgba(255,255,255,.24); }
.badge-dot{
  position:absolute; top:-2px; right:-2px; width:10px;height:10px;border-radius:50%;
  background:var(--gold); border:2px solid var(--pine);
}
.tabbar{
  display:flex; gap:2px; overflow-x:auto; background:var(--pine-2); padding:0 10px;
  -ms-overflow-style:none; scrollbar-width:none;
}
.tabbar::-webkit-scrollbar{ display:none; }
.tab-btn{
  flex:0 0 auto; padding:12px 14px; background:none; border:none; color:rgba(255,255,255,.68);
  font-size:13.5px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;
}
.tab-btn.active{ color:#fff; border-bottom-color:var(--gold); }

.content{ flex:1; padding:20px 18px 60px; max-width:1080px; width:100%; margin:0 auto; }
.update-strip{
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  font-size:12px; color:var(--ink-faint); margin-bottom:16px;
}
.update-strip .refresh-link{ background:none;border:none;color:var(--fairway);font-weight:600;font-size:12px;cursor:pointer;padding:0; }

.section-title{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:28px 0 12px; flex-wrap:wrap; }
.section-title:first-child{ margin-top:0; }
.section-title h2{ font-size:19px; margin:0; color:var(--pine); }
.section-title .hint{ font-size:12.5px; color:var(--ink-faint); }

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
  box-shadow:var(--shadow-card); padding:18px 18px;
}
.card + .card{ margin-top:12px; }
.grid-cards{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:12px; }
.stat-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
  padding:16px 18px; box-shadow:var(--shadow-card);
}
.stat-card .label{ font-size:12.5px; color:var(--ink-soft); font-weight:600; }
.stat-card .value{ font-family:'IBM Plex Mono'; font-variant-numeric:tabular-nums; font-size:24px; font-weight:600; color:var(--pine); margin-top:6px; }
.stat-card .value.neg{ color:var(--alert); }
.stat-card .sub{ font-size:12px; color:var(--ink-faint); margin-top:4px; }

.pill{
  display:inline-flex; align-items:center; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:700;
  letter-spacing:.02em;
}
.pill-admin{ background:var(--pine-tint); color:var(--pine); }
.pill-officer{ background:var(--gold-tint); color:var(--gold); }
.pill-member{ background:var(--surface-2); color:var(--ink-soft); }
.pill-inactive{ background:var(--alert-tint); color:var(--alert); }
.pill-gold-master{ background:var(--gold); color:#2A1F08; }

.table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius-m); background:var(--surface); }
table{ width:100%; border-collapse:collapse; font-size:13.5px; min-width:520px; }
th,td{ padding:10px 12px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
th{ font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); font-weight:700; background:var(--surface-2); }
tr:last-child td{ border-bottom:none; }
td.num, th.num{ font-family:'IBM Plex Mono'; font-variant-numeric:tabular-nums; text-align:right; }
.row-actions{ display:flex; gap:6px; }

.empty-state{ text-align:center; padding:36px 20px; color:var(--ink-faint); font-size:13.5px; }

.form-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:12px 14px; }
.form-actions{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.inline-form{ background:var(--surface-2); border:1px dashed var(--border); border-radius:var(--radius-m); padding:16px; margin-bottom:14px; }
.inline-form h3{ margin:0 0 12px; font-size:14.5px; color:var(--pine); }

.team-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:12px; margin-top:12px; }
.team-card{ background:var(--pine-tint); border-radius:var(--radius-m); padding:14px; }
.team-card h4{ margin:0 0 8px; font-size:13px; color:var(--pine); display:flex; align-items:center; gap:6px; }
.team-card ul{ margin:0; padding:0; list-style:none; }
.team-card li{ font-size:13.5px; padding:3px 0; }

.modal-overlay{
  position:fixed; inset:0; background:rgba(20,26,18,.5); display:flex; align-items:center; justify-content:center;
  z-index:100; padding:20px;
}
.modal-box{
  background:var(--surface); border-radius:var(--radius-l); max-width:420px; width:100%; padding:26px;
  box-shadow:0 20px 60px -12px rgba(0,0,0,.4); border:1px solid var(--border);
}
.modal-box h3{ margin:0 0 10px; color:var(--pine); font-size:19px; }
.modal-box p{ font-size:14px; color:var(--ink-soft); white-space:pre-line; }

.toast-wrap{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; width:100%; padding:0 16px; }
.toast{
  background:var(--pine-2); color:#fff; padding:10px 18px; border-radius:99px; font-size:13.5px; font-weight:600;
  box-shadow:0 8px 24px -6px rgba(0,0,0,.35); max-width:92vw;
}
.toast.warn{ background:var(--gold); color:#2A1F08; }
.toast.error{ background:var(--alert); }

.notice-item{ padding:14px 0; border-bottom:1px solid var(--border); }
.notice-item:last-child{ border-bottom:none; }
.notice-item .meta{ font-size:12.5px; color:var(--ink-faint); margin-bottom:5px; }
.notice-item .title{ font-weight:700; color:var(--pine); margin-bottom:6px; font-size:17px; }
.notice-item .body{ white-space:pre-line; font-size:15.5px; line-height:1.55; }

.textarea-copy{ width:100%; min-height:180px; font-family:'IBM Plex Mono'; font-size:12.5px; padding:12px; border-radius:var(--radius-s); border:1px solid var(--border); background:var(--surface-2); color:var(--ink); white-space:pre; resize:vertical; }

.checklist{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:8px; }
.check-item{ display:flex; align-items:center; flex-wrap:wrap; row-gap:2px; gap:8px; padding:9px 11px; border:1px solid var(--border); border-radius:var(--radius-s); background:var(--surface); font-size:13.5px; }
.check-item .check-name{ white-space:nowrap; }
.check-item.checked{ background:var(--pine-tint); border-color:var(--pine); }
.check-item.unpaid{ background:var(--alert-tint); border-color:var(--alert); color:var(--alert); font-weight:600; }
.check-item input{ width:16px; height:16px; }

.month-nav{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.month-nav .cur{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; color:var(--pine); min-width:110px; text-align:center; }

.install-banner{
  display:flex; align-items:center; gap:12px; background:var(--gold-tint); border:1px solid var(--gold);
  border-radius:var(--radius-m); padding:12px 14px; margin-bottom:16px; font-size:13px;
}
.install-banner .txt{ flex:1; color:var(--ink); }
.install-banner b{ color:var(--gold); }

.helptext{ font-size:12px; color:var(--ink-faint); margin-top:4px; }

@media (min-width:640px){
  .content{ padding:28px 24px 70px; }
}

32,0.14);\n  color-scheme: light;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#12180F;\n    --surface:#1A2318;\n    --surface-2:#212B1E;\n    --border:#33402F;\n    --ink:#ECF1E8;\n    --ink-soft:#AEBBA7;\n    --ink-faint:#7C8977;\n    --pine:#5DA07E;\n    --pine-2:#4A8A69;\n    --pine-tint:#22322A;\n    --fairway:#6FBE94;\n    --gold:#E0B45C;\n    --gold-tint:#3A311D;\n    --alert:#E27259;\n    --alert-tint:#3A211C;\n    --shadow-card:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -10px rgba(0,0,0,0.5);\n    color-scheme: dark;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#12180F;\n  --surface:#1A2318;\n  --surface-2:#212B1E;\n  --border:#33402F;\n  --ink:#ECF1E8;\n  --ink-soft:#AEBBA7;\n  --ink-faint:#7C8977;\n  --pine:#5DA07E;\n  --pine-2:#4A8A69;\n  --pine-tint:#22322A;\n  --fairway:#6FBE94;\n  --gold:#E0B45C;\n  --gold-tint:#3A311D;\n  --alert:#E27259;\n  --alert-tint:#3A211C;\n  --shadow-card:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -10px rgba(0,0,0,0.5);\n  color-scheme: dark;\n}\n*{box-sizing:border-box;}\nhtml,body{margin:0;padding:0;}\nbody{\n  background:var(--bg);\n  color:var(--ink);\n  font-family:'Work Sans', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;\n  font-size:15px;\n  line-height:1.5;\n  -webkit-font-smoothing:antialiased;\n}\nh1,h2,h3,.font-display{\n  font-family:'Fraunces', 'Work Sans', serif;\n  text-wrap:balance;\n  letter-spacing:-0.01em;\n}\n.mono, .num{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }\nbutton{ font-family:inherit; }\na{ color:inherit; }\n::selection{ background:var(--gold-tint); }\n:focus-visible{ outline:2px solid var(--fairway); outline-offset:2px; }\n\n#app{ min-height:100vh; display:flex; flex-direction:column; }\n\n/* ---------- Login ---------- */\n.login-screen{\n  min-height:100vh;\n  display:flex;\n  align-items:center;\n  justify-content:center;\n  padding:24px;\n  background:\n    radial-gradient(1200px 600px at 20% -10%, var(--pine-tint), transparent 60%),\n    var(--bg);\n}\n.login-card{\n  width:100%;\n  max-width:400px;\n  background:var(--surface);\n  border:1px solid var(--border);\n  border-radius:var(--radius-l);\n  box-shadow:var(--shadow-card);\n  padding:36px 32px 30px;\n}\n.login-crest{\n  width:56px;height:56px;border-radius:16px;\n  background:var(--pine);\n  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;\n  color:var(--gold-tint);\n  font-family:'Fraunces',serif;\n  font-weight:700;font-size:12px;letter-spacing:-0.02em;\n  margin-bottom:18px;\n  box-shadow:0 4px 14px -4px rgba(30,70,52,0.5);\n  line-height:1;\n}\n.login-crest .flagmark{ font-size:14px; line-height:1; margin-top:1px; }\n.crest .flagmark{ font-size:15px; line-height:1; }\n.login-card h1{ font-size:26px; margin:0 0 4px; color:var(--pine); }\n.login-card .sub{ color:var(--ink-soft); font-size:13.5px; margin:0 0 26px; }\n.field{ margin-bottom:14px; }\n.field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; letter-spacing:.01em; }\n.field input, .field select, .field textarea{\n  width:100%; padding:11px 13px; border:1px solid var(--border); border-radius:var(--radius-s);\n  background:var(--surface); color:var(--ink); font-size:15px; font-family:inherit;\n}\n.field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--fairway); }\n.btn{\n  display:inline-flex; align-items:center; justify-content:center; gap:6px;\n  padding:11px 18px; border-radius:var(--radius-s); border:1px solid transparent;\n  font-size:14.5px; font-weight:600; cursor:pointer; transition:filter .12s, transform .05s;\n  white-space:nowrap;\n}\n.btn:active{ transform:translateY(1px); }\n.btn-primary{ background:var(--pine); color:#fff; }\n.btn-primary:hover{ filter:brightness(1.1); }\n.btn-gold{ background:var(--gold); color:#2A1F08; }\n.btn-ghost{ background:transparent; color:var(--pine); border-color:var(--border); }\n.btn-ghost:hover{ background:var(--surface-2); }\n.btn-danger{ background:transparent; color:var(--alert); border-color:var(--alert-tint); }\n.btn-danger:hover{ background:var(--alert-tint); }\n.btn-block{ width:100%; }\n.btn-sm{ padding:6px 11px; font-size:13px; border-radius:var(--radius-s); }\n.btn[disabled]{ opacity:.5; cursor:not-allowed; }\n.login-hint{\n  margin-top:18px; padding:12px 14px; background:var(--surface-2); border-radius:var(--radius-s);\n  font-size:12.5px; color:var(--ink-soft); border:1px dashed var(--border);\n}\n.error-text{ color:var(--alert); font-size:13px; margin-top:10px; }\n\n/* ---------- App shell ---------- */\n.topbar{\n  position:sticky; top:0; z-index:20;\n  background:var(--pine); color:#fff;\n  display:flex; align-items:center; gap:12px;\n  padding:12px 18px;\n}\n.topbar .crest{\n  width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.14);\n  display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:17px;\n}\n.topbar .club-name{ font-family:'Fraunces',serif; font-weight:600; font-size:18px; margin-right:auto; }\n.topbar .who{ font-size:13px; opacity:.92; text-align:right; line-height:1.3; }\n.topbar .who b{ font-weight:600; }\n.icon-btn{\n  width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;\n  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;position:relative;\n}\n.icon-btn:hover{ background:rgba(255,255,255,.24); }\n.badge-dot{\n  position:absolute; top:-2px; right:-2px; width:10px;height:10px;border-radius:50%;\n  background:var(--gold); border:2px solid var(--pine);\n}\n.tabbar{\n  display:flex; gap:2px; overflow-x:auto; background:var(--pine-2); padding:0 10px;\n  -ms-overflow-style:none; scrollbar-width:none;\n}\n.tabbar::-webkit-scrollbar{ display:none; }\n.tab-btn{\n  flex:0 0 auto; padding:12px 14px; background:none; border:none; color:rgba(255,255,255,.68);\n  font-size:13. function esc(s){
  if(s===undefined||s===null) return "";

}
function onlyDigits(s){ return String(s||"").replace(/\D/g,""); }
function won(n){

function fmtDateKR(d){
  if(!d) return "-";
  const [y,m,day] = d.split("-");
  const wd = WEEKDAY_KR[new Date(`${d}T00:00:00`).getDay()];
  return `${y}.${m}.${day}(${wd})`;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];

}

// 이름만으로는 연회비 완납 집계 포함 여부를 알 수 없다. 그래서 별도로 d.countsTowardDues
// (true/false)를 두고 이걸로 판단한다. 이 필드가 없는 옛 데이터는 예전 방식대로
// duesType==="sponsor"면 제외, 그 외(정기 회비 취급이던 옛 데이터 포함)는 포함으로 본다.
function depositCountsTowardDues(d){
  if(d.countsTowardDues===false) return false;
  if(d.countsTowardDues===true) return true;
  return d.duesType!=="sponsor";
}
function depositCategoryLabel(d){

    .reduce((s,d)=>s+Number(d.amount||0),0);
}
function memberDuesStatus(memberId, year){

// 월별 정산 화면에서 쓰는 "그 달까지 누적으로 얼마나 냈는지" — 4월에 완납했다면
// 1~3월은 아직 미납으로, 5월부터는 계속 완납으로 보여야 하므로 월별 정산은 연간 총액이 아니라
// "그 달 말 시점까지의 누적 납부액"으로 완납 여부를 판단한다.
function nextMonthKey(mk){
  const [y,m] = mk.split("-").map(Number);
  let ny = y, nm = m+1;
  if(nm>12){ nm = 1; ny = y+1; }
  return ny+"-"+String(nm).padStart(2,"0");
}
function memberAnnualPaidThroughMonth(memberId, mk){
  const yr = mk.slice(0,4);
  const cutoffExclusive = nextMonthKey(mk)+"-01";
  return appState.dues
    .filter(d=> d.type==="deposit" && d.memberId===memberId && (d.date||"").slice(0,4)===yr && depositCountsTowardDues(d) && d.date < cutoffExclusive)
    .reduce((s,d)=>s+Number(d.amount||0),0);
}
function memberDuesStatusThroughMonth(memberId, mk){
  const paid = memberAnnualPaidThroughMonth(memberId, mk);
  const due = annualDuesAmount();
  return { paid, due, complete: paid>=due };
}

// Rebuilds the full, self-contained HTML document (head + current-state seed + this
// exact script) so it can be republished with the "whole document" (html-form) publish
// API, which is the baseline form and doesn't depend on the files-form being enabled
// for this artifact/view. We deliberately do NOT serialize the live DOM (it contains
// viewer-session state and injected runtime scripts) — instead we use a build-time
// static HEAD_TEMPLATE plus Function.prototype.toString() on AppMain, which the JS spec
// (ES2018+) guarantees returns this function's exact original source text.
function buildFullHTML(state){
  // NOTE: this function's own source text (via AppMain.toString(), below) ends up
  // embedded verbatim inside a script element, so its source must never contain the
  // literal end-tag sequence (case-insensitive) — the HTML parser would end the
  // script element right there, regardless of JS string quoting. The tag pieces
  // below are built from separate string fragments so that sequence never appears
  // contiguously in this file. The same guard is applied to user-entered state
  // text, which could otherwise contain that sequence too.
  var closeTag = "<" + "/" + "script>";
  var openTag = "<" + "script>";
  var guard = function(s){ return s.split("<" + "/" + "script").join("<" + "\\/" + "script"); };
  var seedJson = guard(JSON.stringify(state));
  var scriptBody = guard(AppMain.toString() + "\nAppMain();\n");
  return HEAD_TEMPLATE + seedJson + closeTag + "\n" + openTag + "\n" + scriptBody + closeTag + "\n</body>\n</html>\n";
}

/* ---------- CSV export (opens directly in Excel) ---------- */
function csvEscape(v){
  const s = (v===undefined||v===null) ? "" : String(v);
  if(/[",\n\r]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function toCSV(headers, rows){
  const lines = [headers.map(csvEscape).join(",")];
  rows.forEach(r=> lines.push(r.map(csvEscape).join(",")));
  return "﻿" + lines.join("\r\n"); // BOM for Excel/Korean
}
async function downloadCSV(filenameBase, headers, rows){
  const content = toCSV(headers, rows);
  if(!downloadsApi){
    toast("이 화면에서는 파일 다운로드가 지원되지 않아요. 원본 평골회 앱 링크에서 열어주세요.","warn");
    return;
  }

  }catch(err){
    const code = err && err.code;
    if(code==="rejected_extension" || code==="extension_not_enabled"){
      try{

      }catch(err2){
        toast("다운로드에 실패했어요. 다시 시도해주세요.","error");
      }
    }else if(code==="declined"){
      // user cancelled — no toast needed
    }else{

    }

// Fast, repeated interactions (attendance checkboxes, team-size stepper) call this
// instead of persist() directly. A successful save reloads the whole page (see
// buildFullHTML/html-form publish above), so saving on every single click would
// reload mid-click-spree and feel like the page "kicking you out". This applies
// the change to local state immediately (instant UI feedback) but only actually
// publishes once the person pauses for a moment, coalescing a burst of clicks
// into a single save/reload.
function schedulePersist(newState, opts, delayMs){
  appState = newState;
  render();
  if(pendingPersistTimer) clearTimeout(pendingPersistTimer);
  pendingPersistState = newState;
  pendingPersistOpts = opts;
  pendingPersistTimer = setTimeout(()=>{
    const st = pendingPersistState, op = pendingPersistOpts;
    pendingPersistTimer = null;
    pendingPersistState = null;
    pendingPersistOpts = null;
    persist(st, op);
  }, delayMs || 1000);
}

async function persist(newState, opts){
  opts = opts || {};
  // A deliberate save (e.g. clicking "랜덤 조편성") should include any not-yet-flushed
  // debounced change and shouldn't leave a stale duplicate save scheduled behind it.
  if(pendingPersistTimer){
    clearTimeout(pendingPersistTimer);
    pendingPersistTimer = null;
    pendingPersistState = null;
    pendingPersistOpts = null;
  }
  const prev = confirmedState;
  newState.version = (newState.version||0) + 1;
  newState.updatedAt = Date.now();
  appState = newState;
  render();
  if(!artifactApi){
    toast("이 화면에서는 저장이 지원되지 않아요. 원본 평골회 앱 링크에서 열어주세요.", "warn");
    confirmedState = newState; // allow local viewing to proceed within this session
    return;
  }
  try{
    const html = buildFullHTML(newState);
    await artifactApi.publish(html);
    // Success reloads this view with the freshly published document, so there's
    // usually no more code of ours left running after this point — but keep state
    // consistent in case the reload is delayed.
    confirmedState = newState;
    if(opts.toastMsg!==false) toast(opts.toastMsg || "저장되었습니다.", "ok");
  }catch(err){
    const code = err && err.code;
    if(code==="not_writer" || code==="not_granted"){
      writeDisabled = true;
      toast("저장 권한이 없는 화면이에요. 총무님 계정으로 열린 원본 링크에서 입력해주세요.", "error");
    }else if(code==="conflict"){
      toast("다른 곳에서 방금 먼저 저장했어요. 최신 내용을 불러올게요.", "warn");
      setTimeout(()=>location.reload(), 900);
      return;
    }else{
      toast("저장 중 문제가 발생했어요. 다시 시도해주세요. (" + (code || "오류") + ")", "error");
    }
    appState = prev;
    render();
  }
}

/* ---------- auth ---------- */
function attemptLogin(name, phone){
  const n = String(name||"").trim();
  const p = onlyDigits(phone);
  if(!n || !p) return { ok:false, msg:"이름과 전화번호를 모두 입력해주세요." };
  const found = appState.members.find(m => m.name.trim()===n && onlyDigits(m.phone)===p);
  if(!found) return { ok:false, msg:"이름 또는 전화번호가 일치하지 않아요. 총무님께 등록된 정보를 확인해주세요." };
  if(found.active===false) return { ok:false, msg:"비활성화된 회원입니다. 총무님께 문의해주세요." };
  if(found.role==="admin" && appState.club && appState.club.adminPin){
    pendingPinLogin = found.id;
    return { ok:false, needPin:true };
  }
  session.memberId = found.id;
  session.tab = "home";
  saveSession();
  return { ok:true };
}
function attemptPinLogin(pin){
  const found = pendingPinLogin && appState.members.find(m=>m.id===pendingPinLogin);
  if(!found) return { ok:false, msg:"다시 이름/전화번호부터 입력해주세요." };
  if(String(pin||"") !== String(appState.club.adminPin||"")){
    return { ok:false, msg:"비밀번호가 일치하지 않아요." };
  }
  session.memberId = found.id;
  session.tab = "home";
  pendingPinLogin = null;
  saveSession();
  return { ok:true };
}
function logout(){
  session.memberId = null;
  saveSession();
  render();
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, type){
  let wrap = document.querySelector(".toast-wrap");
  if(!wrap){
    wrap = document.createElement("div");
    wrap.className = "toast-wrap";
    document.body.appendChild(wrap);
  }
  wrap.innerHTML = `<div class="toast ${type||''}">${esc(msg)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ wrap.innerHTML = ""; }, 3200);
}

/* ---------- confirm modal (native confirm() is blocked inside the sandboxed artifact frame) ---------- */
function showConfirm(message, onYes){
  const existing = document.querySelector(".modal-overlay");
  if(existing) existing.remove();
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>확인</h3>
      <p>${esc(message)}</p>
      <div class="form-actions">
        <button class="btn btn-ghost btn-block" data-role="cancel">취소</button>
        <button class="btn btn-danger btn-block" data-role="ok">삭제</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.addEventListener("click", (e)=>{
    if(e.target===overlay || e.target.closest('[data-role="cancel"]')){ close(); return; }
    if(e.target.closest('[data-role="ok"]')){ close(); onYes(); }
  });
}

/* ---------- notice popup / notifications ---------- */
function checkNewNotice(){
  if(document.querySelector(".modal-overlay")) return; // avoid stacking duplicate popups
  const list = (appState.announcements||[]).slice().sort((a,b)=>b.createdAt-a.createdAt);
  if(!list.length) return;
  const latest = list[0];
  const seen = getLastSeenNoticeId();
  if(seen === String(latest.id)) return;
  showNoticePopup(latest);
  if(window.Notification && Notification.permission==="granted"){
    try{ new Notification("평골회 새 공지: "+latest.title, { body: latest.body.slice(0,120) }); }catch(e){}
  }
}
function showNoticePopup(notice){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>📣 새 공지</h3>
      <p><strong>${esc(notice.title)}</strong>\n\n${esc(notice.body)}</p>
      <div class="form-actions">
        <button class="btn btn-primary btn-block" data-action="ack-notice" data-id="${esc(notice.id)}">확인했어요</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e)=>{
    if(e.target===overlay || e.target.closest('[data-action="ack-notice"]')){
      setLastSeenNoticeId(String(notice.id));
      overlay.remove();
      render();
    }
  });
}

/* ============================================================
   RENDER
   ============================================================ */
// render() replaces the whole app HTML (root.innerHTML = ...) on every change,
// which destroys and recreates every DOM node — including whichever <input> the
// person is actively typing/editing in. That kills focus mid-edit (the field
// "튕겨나가는"/"팅기는" feeling — Tee off 시간, 코스 등 입력 중 포커스가 날아가던 문제).
// Fix: remember which field was focused (by its stable data-* attributes, since
// ids aren't stable across re-renders) and its cursor/selection position before
// re-rendering, then restore focus (and selection, where supported) to the new
// matching element afterward.
function focusFingerprint(el){
  if(!el || !el.matches || !el.matches("input,textarea,select")) return null;
  const attrs = ["data-action","data-event","data-team-idx","data-member","data-guest","data-id","data-kind","name"];
  let sel = el.tagName.toLowerCase();
  let any = false;
  attrs.forEach(a=>{
    const v = el.getAttribute(a);
    if(v!==null){ sel += `[${a}="${v.replace(/["\\]/g,"\\$&")}"]`; any = true; }
  });
  if(!any) return null;
  return sel;
}
function render(){
  const root = document.getElementById("app");
  if(!session.memberId || !me()){
    root.innerHTML = renderLogin();
    return;
  }
  const active = document.activeElement;
  const wasInApp = active && root.contains(active);
  const fp = wasInApp ? focusFingerprint(active) : null;
  // Some input types (time, number, email, ...) throw on reading selectionStart/End
  // instead of just returning null, so this has to be try/caught, not just type-checked.
  let selStart = null, selEnd = null;
  if(wasInApp){
    try{
      if(typeof active.selectionStart==="number"){ selStart = active.selectionStart; selEnd = active.selectionEnd; }
    }catch(e){ selStart = null; selEnd = null; }
  }

  root.innerHTML = renderShell();

  if(fp){
    let el;
    try{ el = root.querySelector(fp); }catch(e){ el = null; }
    if(el){
      el.focus({preventScroll:true});
      if(selStart!==null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

function formatPhone(p){
  const d = onlyDigits(p);
  if(d.length===11) return d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7);
  if(d.length===10) return d.slice(0,3)+"-"+d.slice(3,6)+"-"+d.slice(6);
  return p||"-";
}
function maskPhone(p){
  const d = onlyDigits(p);
  if(d.length===11) return d.slice(0,3)+"-****-"+d.slice(7);
  if(d.length===10) return d.slice(0,3)+"-***-"+d.slice(6);
  return p||"-";
}
function displayPhone(p){ return isAdmin() ? formatPhone(p) : maskPhone(p); }

function renderTeamGrid(ev, admin){

function renderManualTeamForm(ev){
  const attendeeIds = (ev.attendance||[]).filter(id=> appState.members.find(m=>m.id===id) || (ev.guests||[]).find(g=>g.id===id));
  if(!attendeeIds.length){
    return `<div class="empty-state">참석자를 먼저 체크해주세요.</div>`;
  }
  const teams = ev.teams||[];
  const suggestedCount = Math.max(1, Math.ceil(attendeeIds.length / (ev.teamSize||4)));
  const teamCount = Math.max(teams.length, suggestedCount, 1);
  const activeIdx = Math.min(session.manualTeamActive[ev.id]||0, teamCount-1);
  const teamOfMember = {};
  teams.forEach((team,i)=> team.forEach(id=> teamOfMember[id]=i));

  return `
  <div class="inline-form">
    <p class="helptext" style="margin:0 0 10px;">조를 고른 뒤 그 조에 넣을 참석자를 체크하세요. 체크마다 바로 저장돼요. 조·인원 수는 필요하면 얼마든지 늘릴 수 있어요.</p>
    <div class="form-actions" style="margin-top:0;flex-wrap:wrap;">
      ${Array.from({length:teamCount},(_,i)=>i).map(i=>`
        <button type="button" class="btn ${i===activeIdx?'btn-primary':'btn-ghost'} btn-sm" data-action="set-manual-team-tab" data-event="${ev.id}" data-idx="${i}">${i+1}조 (${(teams[i]||[]).length}명)</button>
      `).join("")}
      <button type="button" class="btn btn-gold btn-sm" data-action="add-manual-team" data-event="${ev.id}">+ 조 추가</button>
      ${teamCount>1 ? `<button type="button" class="btn btn-danger btn-sm" data-action="remove-manual-team" data-event="${ev.id}" data-idx="${teamCount-1}">${teamCount}조 삭제</button>`:""}
    </div>
    <div class="checklist" style="margin-top:10px;">
      ${attendeeIds.map(id=>`
        <label class="check-item ${teamOfMember[id]===activeIdx?'checked':''}">
          <input type="checkbox" data-action="toggle-team-member" data-event="${ev.id}" data-team-idx="${activeIdx}" data-member="${id}" ${teamOfMember[id]===activeIdx?'checked':''}>
          ${esc(participantLabel(ev,id))}${teamOfMember[id]!==undefined && teamOfMember[id]!==activeIdx? ` <span class="hint">(현재 ${teamOfMember[id]+1}조)</span>`:''}
        </label>`).join("")}
    </div>
  </div>`;
}

/* ---------- ANNUAL SCHEDULE ---------- */
const MONTH_NAMES = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
function renderSchedule(){
  const yr = session.scheduleYear;
  const yearEvents = appState.events.filter(ev=>ev.date.slice(0,4)===yr).sort((a,b)=>a.date.localeCompare(b.date));
  const byMonth = {};
  yearEvents.forEach(ev=>{
    const m = Number(ev.date.slice(5,7));
    (byMonth[m] = byMonth[m]||[]).push(ev);
  });
  const today = todayStr();
  const rows = MONTH_NAMES.map((label,i)=>{
    const m = i+1;
    const evs = byMonth[m];
    if(!evs || !evs.length){
      return `<tr><td>${label}</td><td class="hint" colspan="4">모임 일정 없음</td></tr>`;
    }
    return evs.map(ev=>{
      const status = ev.date < today ? "완료" : (ev.date === today ? "오늘" : "예정");
      const teamTxt = ev.teams && ev.teams.length ? `${ev.teams.length}개 조` : "조 편성 전";
      return `<tr>
        <td>${label}</td>
        <td>${fmtDateKR(ev.date)}${ev.time? ' '+ev.time:''}</td>
        <td>${esc(ev.location||"장소 미정")}</td>
        <td>${(ev.attendance||[]).length}명 · ${teamTxt}</td>
        <td><span class="pill ${status==='완료'?'pill-member':status==='오늘'?'pill-officer':'pill-admin'}">${status}</span></td>
      </tr>`;
    }).join("");
  }).join("");

  return `
  <div class="section-title"><h2>연간 일정</h2></div>
  <div class="card">
    <div class="month-nav">
      <button class="btn btn-ghost btn-sm" data-action="shift-schedule-year" data-dir="-1">◀</button>
      <div class="cur">${yr}년</div>
      <button class="btn btn-ghost btn-sm" data-action="shift-schedule-year" data-dir="1">▶</button>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>월</th><th>날짜</th><th>장소</th><th>참석·조편성</th><th>상태</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <p class="helptext">모임은 [모임·조편성] 메뉴에서 미리 날짜를 등록해두면 연간 일정에 자동으로 표시돼요.</p>
  </div>
  `;
}
function exportScheduleCSV(yr){
  const yearEvents = appState.events.filter(ev=>ev.date.slice(0,4)===yr).sort((a,b)=>a.date.localeCompare(b.date));
  const headers = ["날짜","시간","장소","행사내용","참석인원","참석자","조편성"];
  const rows = yearEvents.map(ev=>{
    const names = (ev.attendance||[]).map(id=>participantLabel(ev,id));
    const teamsTxt = (ev.teams||[]).map((team,i)=>{
      const teamNames = team.map(id=>participantLabel(ev,id));
      const tt = (ev.teamTeeTimes||[])[i];
      const cc = (ev.teamCourses||[])[i];
      const meta = [cc, tt].filter(Boolean).join(" ");
      return `${i+1}조${meta? '('+meta+')':''}:${teamNames.join("/")}`;
    }).join("  ");
    return [ev.date, ev.time||"", ev.location||"", ev.content||"", names.length, names.join("/"), teamsTxt];
  });
  downloadCSV(`평골회_${yr}년_일정_조편성`, headers, rows);
}

function renderLedger(){
  const list = appState.dues.slice().sort((a,b)=> a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  let bal = 0;
  const rows = list.map(d=>{
    const amt = Number(d.amount||0);
    bal += d.type==="deposit" ? amt : -amt;
    const who = d.type==="deposit" ? ((appState.members.find(m=>m.id===d.memberId)||{}).name || (d.memberId ? "(탈퇴·삭제된 회원)" : "클럽(이월금 등)")) : (d.category||"기타");
    return `<tr>
      <td>${fmtDateKR(d.date)}</td>
      <td><span class="pill ${d.type==='deposit'?'pill-admin':'pill-officer'}">${d.type==='deposit'?'입금':'지출'}</span></td>
      <td>${esc(who)}</td>
      <td class="num">${d.type==='deposit'? won(amt) : '-'+won(amt).replace('-','')}</td>
      <td class="num">${won(bal)}</td>
    </tr>`;
  }).reverse().join("");
  return `
  <div class="section-title"><h2>회비 출납부</h2><span class="hint">전체 입출금을 최근 날짜순으로 모은 장부예요</span></div>
  <div class="table-wrap"><table>
    <thead><tr><th>날짜</th><th>구분</th><th>내용</th><th class="num">금액</th><th class="num">잔액</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="5" class="empty-state">내역이 없어요.</td></tr>`}</tbody>
  </table></div>
  `;
}
function exportLedgerCSV(){
  const list = appState.dues.slice().sort((a,b)=> a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  let bal = 0;
  const headers = ["날짜","구분","내용","금액","잔액"];

function monthDeposits(mk){ return appState.dues.filter(d=>d.type==="deposit" && monthKeyOf(d.date)===mk); }
function monthExpenses(mk){ return appState.dues.filter(d=>d.type==="expense" && monthKeyOf(d.date)===mk); }
function balanceUpTo(dateExclusiveEnd){
  const list = appState.dues.filter(d=> d.date < dateExclusiveEnd);
  return balanceTotals(list).net;
}
function renderMonthlySettlement(mk){
  const deps = monthDeposits(mk), exps = monthExpenses(mk);
  const depSum = deps.reduce((s,d)=>s+Number(d.amount||0),0);
  const expSum = exps.reduce((s,d)=>s+Number(d.amount||0),0);
  const monthStart = mk+"-01";
  const carry = balanceUpTo(monthStart);
  const ending = carry + depSum - expSum;
  const byCat = {};
  exps.forEach(e=>{ byCat[e.category||"기타"] = (byCat[e.category||"기타"]||0) + Number(e.amount||0); });
  return `
  <div class="grid-cards" style="margin-bottom:10px;">
    <div class="stat-card"><div class="label">이월 잔액</div><div class="value" style="font-size:18px;">${won(carry)}</div></div>
    <div class="stat-card"><div class="label">이번달 입금</div><div class="value" style="font-size:18px;">${won(depSum)}</div></div>
    <div class="stat-card"><div class="label">이번달 지출</div><div class="value" style="font-size:18px;">${won(expSum)}</div></div>
    <div class="stat-card"><div class="label">월말 잔액</div><div class="value ${ending<0?'neg':''}" style="font-size:18px;">${won(ending)}</div></div>
  </div>
  ${Object.keys(byCat).length ? `<div class="hint">지출 항목: ${Object.entries(byCat).map(([k,v])=>`${k} ${won(v)}`).join(" · ")}</div>` : ""}
  `;
}
function renderAnnualSettlement(yr){
  const deps = appState.dues.filter(d=>d.type==="deposit" && d.date.slice(0,4)===yr);
  const exps = appState.dues.filter(d=>d.type==="expense" && d.date.slice(0,4)===yr);
  const depSum = deps.reduce((s,d)=>s+Number(d.amount||0),0);
  const expSum = exps.reduce((s,d)=>s+Number(d.amount||0),0);
  const carry = balanceUpTo(yr+"-01-01");
  const ending = carry + depSum - expSum;
  const byCat = {};
  exps.forEach(e=>{ byCat[e.category||"기타"] = (byCat[e.category||"기타"]||0) + Number(e.amount||0); });
  const byMonth = {};
  exps.forEach(e=>{ const mk = monthKeyOf(e.date); byMonth[mk] = (byMonth[mk]||0) + Number(e.amount||0); });
  const monthRows = Object.keys(byMonth).sort().map(mk=>`
    <tr><td>${monthLabel(mk)}</td><td class="num">${won(byMonth[mk])}</td></tr>
  `).join("");
  return `
  <div class="grid-cards">
    <div class="stat-card"><div class="label">연초 이월</div><div class="value" style="font-size:18px;">${won(carry)}</div></div>
    <div class="stat-card"><div class="label">연간 입금</div><div class="value" style="font-size:18px;">${won(depSum)}</div></div>
    <div class="stat-card"><div class="label">연간 지출</div><div class="value" style="font-size:18px;">${won(expSum)}</div></div>
    <div class="stat-card"><div class="label">연말 잔액</div><div class="value ${ending<0?'neg':''}" style="font-size:18px;">${won(ending)}</div></div>
  </div>
  ${Object.keys(byCat).length ? `<div class="hint" style="margin-top:10px;">지출 항목: ${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k} ${won(v)}`).join(" · ")}</div>` : ""}
  ${monthRows ? `
  <div class="table-wrap" style="margin-top:10px;"><table>
    <thead><tr><th>월</th><th>지출액</th></tr></thead>
    <tbody>${monthRows}</tbody>
  </table></div>` : ""}
  `;
}
function renderPayerStatus(mk){
  // 연회비는 한 해치를 한 번에(또는 나눠서) 내는 방식이라, "이 달에 입금했는지"가 아니라
  // "이 달 말 시점까지 누적으로 연회비를 다 냈는지"로 완납·미납을 판단한다.
  // 예: 4월에 완납했다면 1~3월은 미납, 5월부터는 계속 완납으로 보여야 한다.
  const due = annualDuesAmount();
  const list = activeMembers();
  const paid = list.filter(m=>memberDuesStatusThroughMonth(m.id, mk).complete);
  const unpaid = list.filter(m=>!memberDuesStatusThroughMonth(m.id, mk).complete);
  return `
  <div class="section-title" style="margin-top:22px;"><h2 style="font-size:14.5px;">회비 납부 현황</h2><span class="hint">관리자·임원진만 볼 수 있어요 · ${monthLabel(mk)}까지 누적, 연회비 ${won(due)} 기준</span></div>
  <div class="checklist" style="margin-bottom:10px;">
    ${paid.map(m=>`<div class="check-item checked"><span class="check-name">✔ ${esc(m.name)}</span> <span class="hint">(${won(memberAnnualPaidThroughMonth(m.id, mk))})</span></div>`).join("")}
    ${unpaid.map(m=>`<div class="check-item unpaid"><span class="check-name">미납 ${esc(m.name)}</span> <span class="hint">(${won(memberAnnualPaidThroughMonth(m.id, mk))} / ${won(due)})</span></div>`).join("")}
  </div>
  <p class="helptext">완납 ${paid.length}명 · 미납 ${unpaid.length}명 (활동회원 ${list.length}명 기준, ${monthLabel(mk)}까지 누적·찬조금 제외)</p>
  `;
}
function renderAnnualPayerStatus(yr){
  const due = annualDuesAmount();
  const list = activeMembers();
  const rows = list.map(m=>{
    const st = memberDuesStatus(m.id, yr);
    return `<div class="check-item ${st.complete?'checked':'unpaid'}"><span class="check-name">${st.complete?'✔ 완납':'미납'} ${esc(m.name)}</span> <span class="hint">(${won(st.paid)} / ${won(due)})</span></div>`;
  }).join("");
  const doneCount = list.filter(m=>memberDuesStatus(m.id,yr).complete).length;
  return `
  <div class="section-title" style="margin-top:22px;"><h2 style="font-size:14.5px;">${yr}년 연회비 완납 현황</h2><span class="hint">관리자·임원진만 볼 수 있어요 · 1인당 ${won(due)} 기준, 찬조금 제외</span></div>
  <div class="checklist" style="margin-bottom:10px;">${rows || `<div class="empty-state">활동 회원이 없어요.</div>`}</div>
  <p class="helptext">완납 ${doneCount}명 · 미납 ${list.length-doneCount}명 (활동회원 ${list.length}명 기준)</p>
  `;
}
function buildMonthlyNoticeText(mk){
  const deps = monthDeposits(mk), exps = monthExpenses(mk);
  const depSum = deps.reduce((s,d)=>s+Number(d.amount||0),0);
  const expSum = exps.reduce((s,d)=>s+Number(d.amount||0),0);
  const carry = balanceUpTo(mk+"-01");
  const ending = carry + depSum - expSum;
  const byCat = {};
  exps.forEach(e=>{ byCat[e.category||"기타"] = (byCat[e.category||"기타"]||0) + Number(e.amount||0); });
  let lines = [];
  lines.push(`[평골회 ${monthLabel(mk)} 회비 정산 공지]`);
  lines.push("");
  lines.push(`이월 잔액: ${won(carry)}`);
  lines.push(`이번달 입금: ${won(depSum)} (${deps.length}건)`);
  lines.push(`이번달 지출: ${won(expSum)} (${exps.length}건)`);
  lines.push(`월말 잔액: ${won(ending)}`);
  if(Object.keys(byCat).length){
    lines.push("");
    lines.push("[지출 내역]");
    Object.entries(byCat).forEach(([k,v])=> lines.push(`- ${k}: ${won(v)}`));
  }
  lines.push("");
  lines.push("항상 회비 관리에 협조해 주셔서 감사합니다.");
  return lines.join("\n");
}
function buildAnnualNoticeText(yr){
  const deps = appState.dues.filter(d=>d.type==="deposit" && d.date.slice(0,4)===yr);
  const exps = appState.dues.filter(d=>d.type==="expense" && d.date.slice(0,4)===yr);
  const depSum = deps.reduce((s,d)=>s+Number(d.amount||0),0);
  const expSum = exps.reduce((s,d)=>s+Number(d.amount||0),0);
  const carry = balanceUpTo(yr+"-01-01");
  const ending = carry + depSum - expSum;
  let lines = [];
  lines.push(`[평골회 ${yr}년 연간 회비 정산 공지]`);
  lines.push("");
  lines.push(`연초 이월: ${won(carry)}`);
  lines.push(`연간 입금 합계: ${won(depSum)} (${deps.length}건)`);
  lines.push(`연간 지출 합계: ${won(expSum)} (${exps.length}건)`);
  lines.push(`연말 잔액: ${won(ending)}`);
  lines.push("");
  lines.push("한 해 동안 회비 관리에 협조해 주셔서 감사합니다.");
  return lines.join("\n");
}

/* ============================================================
   EVENT HANDLERS
   ============================================================ */
function wireEvents(){
  document.body.addEventListener("submit", onSubmit);
  document.body.addEventListener("click", onClick);
  document.body.addEventListener("change", onChange);
  // blur doesn't bubble, so this has to be registered on the capture phase to catch
  // it from any descendant field via delegation.
  document.body.addEventListener("blur", onBlurCapture, true);
  // A save republishes the whole page and reloads it (html-form publish). Remember
  // scroll position so a reload mid-조편성 (or anywhere else) doesn't feel like it
  // yanks the person back to the top of the screen.
  let scrollSaveTimer = null;
  window.addEventListener("scroll", ()=>{
    clearTimeout(scrollSaveTimer);
    scrollSaveTimer = setTimeout(()=>{
      try{ localStorage.setItem("pgh_scrollY", String(window.scrollY||0)); }catch(e){}
    }, 200);
  }, {passive:true});
}
function restoreScrollPosition(){
  try{
    const y = Number(localStorage.getItem("pgh_scrollY")||0);
    if(y>0) requestAnimationFrame(()=> requestAnimationFrame(()=> window.scrollTo(0, y)));
  }catch(e){}
}

function onSubmit(e){
  const form = e.target;
  if(!form.matches("form")) return;
  e.preventDefault();
  const fd = new FormData(form);

  if(form.matches('[data-form="login"]')){
    const res = attemptLogin(fd.get("name"), fd.get("phone"));
    if(!res.ok){
      if(res.needPin){ render(); return; }
      const box = form.querySelector("#login-error");
      if(box) box.innerHTML = `<div class="error-text">${esc(res.msg)}</div>`;
      return;
    }
    render();
    setTimeout(checkNewNotice, 200);
    return;
  }

  if(form.matches('[data-form="login-pin"]')){
    const res = attemptPinLogin(fd.get("pin"));
    if(!res.ok){
      const box = form.querySelector("#login-error");
      if(box) box.innerHTML = `<div class="error-text">${esc(res.msg)}</div>`;
      return;
    }
    render();
    setTimeout(checkNewNotice, 200);
    return;
  }

  if(form.matches('[data-form="member"]')){
    const id = form.dataset.id;
    const s = cloneState();
    const payload = {
      name: String(fd.get("name")||"").trim(),
      phone: String(fd.get("phone")||"").trim(),
      position: String(fd.get("position")||"").trim(),
      role: fd.get("role"),
      extendedDuesView: fd.get("extendedDuesView")==="1",
      active: fd.get("active")!=="0"
    };
    if(!payload.name || !payload.phone){ toast("이름과 전화번호를 입력해주세요.","error"); return; }
    const existingTarget = id ? s.members.find(m=>m.id===id) : null;
    if(id && id===session.memberId){
      if(payload.role!=="admin"){ toast("본인의 관리자 권한은 여기서 낮출 수 없어요. 다른 관리자에게 요청해주세요.","error"); return; }
      if(payload.active===false){ toast("본인 계정은 비활성화할 수 없어요.","error"); return; }
    }
    if(existingTarget && existingTarget.isMaster){
      // 마스터 관리자 계정은 이름/전화번호/직책만 바꿀 수 있고 권한·활성상태는 고정
      payload.role = "admin";
      payload.active = true;
      payload.extendedDuesView = true;
    }
    if(id){
      const idx = s.members.findIndex(m=>m.id===id);
      if(idx>-1) s.members[idx] = { ...s.members[idx], ...payload, isMaster: existingTarget? !!existingTarget.isMaster : false };
    }else{
      s.members.push({ id: uid("m"), ...payload });
    }
    session.memberFormOpen = null;
    persist(s, {toastMsg:"회원 정보를 저장했어요."});
    return;
  }

  if(form.matches('[data-form="event"]')){
    const editId = form.dataset.editId || null;
    const s = cloneState();
    const payload = {
      date: fd.get("date"),
      time: String(fd.get("time")||"").trim(),
      location: String(fd.get("location")||"").trim(),
      content: String(fd.get("content")||"").trim()
    };
    if(editId){
      const idx = s.events.findIndex(ev=>ev.id===editId);
      if(idx===-1){
        toast("이미 삭제된 모임이에요.","error");
        session.eventFormOpen = false;
        render();
        return;
      }
      s.events[idx] = { ...s.events[idx], ...payload };
      session.eventFormOpen = false;
      persist(s, {toastMsg:"모임 정보를 수정했어요."});
      return;
    }
    s.events.push({
      id: uid("e"),
      ...payload,
      teamSize: 4,
      teams: [],
      teamTeeTimes: [],
      teamCourses: [],
      attendance: [],
      guests: []
    });
    session.eventFormOpen = false;
    persist(s, {toastMsg:"모임을 등록했어요."});
    return;
  }

  if(form.matches('[data-form="dues"]')){
    const kind = form.dataset.kind;
    const editId = form.dataset.editId || null;
    const s = cloneState();
    const amount = Number(fd.get("amount"))||0;
    if(amount<=0){ toast("금액을 확인해주세요.","error"); return; }
    if(editId){
      const idx = s.dues.findIndex(d=>d.id===editId);
      if(idx===-1){
        toast("이미 삭제된 내역이에요.","error");
        session.duesEditId = null; session.duesFormOpen = null;
        render();
        return;
      }
      if(kind==="deposit"){
        s.dues[idx] = { ...s.dues[idx], type:"deposit", date: fd.get("date"), memberId: fd.get("memberId"), category: String(fd.get("category")||"").trim()||"정기 회비", countsTowardDues: fd.get("countsTowardDues")!=="0", amount, memo: String(fd.get("memo")||"").trim() };
        delete s.dues[idx].duesType;
      }else{
        s.dues[idx] = { ...s.dues[idx], type:"expense", date: fd.get("date"), category: String(fd.get("category")||"").trim()||"기타", amount, memo: String(fd.get("memo")||"").trim() };
      }
      session.duesEditId = null;
      session.duesFormOpen = null;
      persist(s, {toastMsg:"회비 내역을 수정했어요."});
      return;
    }
    if(kind==="deposit"){
      s.dues.push({ id: uid("d"), type:"deposit", date: fd.get("date"), memberId: fd.get("memberId"), category: String(fd.get("category")||"").trim()||"정기 회비", countsTowardDues: fd.get("countsTowardDues")!=="0", amount, memo: String(fd.get("memo")||"").trim() });
    }else{
      s.dues.push({ id: uid("d"), type:"expense", date: fd.get("date"), category: String(fd.get("category")||"").trim()||"기타", amount, memo: String(fd.get("memo")||"").trim() });
    }
    session.duesFormOpen = null;
    persist(s, {toastMsg:"회비 내역을 저장했어요."});
    return;
  }

  if(form.matches('[data-form="club-settings"]')){
    const s = cloneState();
    s.club = s.club || {};
    s.club.annualDues = Math.max(0, Number(fd.get("annualDues"))||0);
    persist(s, {toastMsg:"연회비 설정을 저장했어요."});
    return;
  }

  if(form.matches('[data-form="admin-pin-settings"]')){
    const val = String(fd.get("adminPin")||"");
    if(!val){ toast("변경할 비밀번호를 입력해주세요.","warn"); return; }
    const s = cloneState();
    s.club = s.club || {};
    s.club.adminPin = val;
    persist(s, {toastMsg:"관리자 비밀번호를 저장했어요."});
    return;
  }

  if(form.matches('[data-form="notice"]')){
    const s = cloneState();
    s.announcements.push({ id: uid("a"), date: fd.get("date"), title: String(fd.get("title")||"").trim(), body: String(fd.get("body")||"").trim(), createdAt: Date.now() });
    session.noticeFormOpen = false;
    persist(s, {toastMsg:"공지를 등록했어요."});
    return;
  }

  if(form.matches('[data-form="add-guest"]')){
    const eventId = form.dataset.event;
    const name = String(fd.get("guestName")||"").trim();
    if(!name){ toast("게스트 이름을 입력해주세요.","error"); return; }
    const s = cloneState();
    const ev = s.events.find(x=>x.id===eventId);
    if(!ev) return;
    const guestId = uid("g");
    ev.guests = ev.guests||[];
    ev.guests.push({ id: guestId, name });
    ev.attendance = ev.attendance||[];
    ev.attendance.push(guestId);
    persist(s, {toastMsg:"게스트를 추가했어요."});
    return;
  }
}

function onChange(e){
  const t = e.target;
  if(t.matches('[data-action="toggle-attendance"]')){
    const s = cloneState();
    const ev = s.events.find(x=>x.id===t.dataset.event);
    if(!ev) return;
    ev.attendance = ev.attendance||[];
    const mid = t.dataset.member;
    if(t.checked){ if(!ev.attendance.includes(mid)) ev.attendance.push(mid); }
    else{
      ev.attendance = ev.attendance.filter(id=>id!==mid);
      // Just drop this person from whichever team they were in — keep the team
      // slots themselves (including any that become empty), since an admin may
      // have deliberately created a team slot ahead of assigning people to it.
      ev.teams = (ev.teams||[]).map(team=>team.filter(id=>id!==mid));
    }
    schedulePersist(s, {toastMsg:false}, 2500);
    return;
  }
  if(t.matches('[data-action="set-teamsize"]')){
    const s = cloneState();
    const ev = s.events.find(x=>x.id===t.dataset.event);
    if(!ev) return;
    ev.teamSize = Math.max(1, Math.min(99, Number(t.value)||4));
    schedulePersist(s, {toastMsg:false}, 2500);
    return;
  }
  // Tee off 시간·코스 입력은 onBlurCapture()에서 blur 시점에만 저장한다 (아래 설명 참고) —
  // 여기 onChange에서 처리하지 않는다.
  if(t.matches('[data-action="toggle-team-member"]')){
    const s = cloneState();
    const ev = s.events.find(x=>x.id===t.dataset.event);
    if(!ev) return;
    const idx = Number(t.dataset.teamIdx);
    const mid = t.dataset.member;
    ev.teams = ev.teams||[];
    while(ev.teams.length <= idx) ev.teams.push([]);
    // a person belongs to at most one team — drop them from any other team first
    ev.teams = ev.teams.map(team=>team.filter(id=>id!==mid));
    if(t.checked) ev.teams[idx].push(mid);
    schedulePersist(s, {toastMsg:false}, 2500);
    return;
  }
}

// Tee off 시간·코스 입력칸 전용: 저장(persist)이 성공하면 실제로는 페이지 전체가
// 새로 발행된 문서로 다시 로드된다 (self-publish). 'change' 이벤트로 즉시 저장하면
// <input type="time">는 시/분을 다 채우는 순간(아직 그 칸 안에 있는데도) change가
// 발생해서 그 타이밍에 재로드가 걸리고, 입력 중이던 포커스가 날아가 버린다("팅기는").
// blur(그 칸을 떠날 때)로 옮기는 것만으로는 부족한데, 조 카드 하나에 코스·시간 두 칸이
// 있어서 "코스 입력 → Tab → 시간 입력"처럼 연달아 옮겨다니면 각 필드를 떠날 때마다
// 재로드가 걸려 다음 칸으로 넘어가려던 동작 자체가 매번 끊긴다. 그래서 즉시 저장 대신
// schedulePersist로 짧게 묶어서(marked 900ms), 연속으로 여러 칸을 옮겨다니는 동안은
// 재로드 없이 화면만 갱신되다가 손을 뗀 뒤 한 번만 실제로 저장(재로드)되게 한다.
function onBlurCapture(e){
  const t = e.target;
  if(!t || !t.matches) return;
  if(t.matches('[data-action="set-team-tee-time"]')){
    const s = cloneState();
    const ev = s.events.find(x=>x.id===t.dataset.event);
    if(!ev) return;
    const idx = Number(t.dataset.teamIdx);
    ev.teamTeeTimes = ev.teamTeeTimes||[];
    while(ev.teamTeeTimes.length <= idx) ev.teamTeeTimes.push("");
    if(ev.teamTeeTimes[idx]===t.value) return; // unchanged — skip a needless save/reload
    ev.teamTeeTimes[idx] = t.value;
    schedulePersist(s, {toastMsg:false}, 900);
    return;
  }
  if(t.matches('[data-action="set-team-course"]')){
    const s = cloneState();
    const ev = s.events.find(x=>x.id===t.dataset.event);
    if(!ev) return;
    const idx = Number(t.dataset.teamIdx);
    ev.teamCourses = ev.teamCourses||[];
    while(ev.teamCourses.length <= idx) ev.teamCourses.push("");
    const val = String(t.value||"").trim();
    if(ev.teamCourses[idx]===val) return; // unchanged — skip a needless save/reload
    ev.teamCourses[idx] = val;
    schedulePersist(s, {toastMsg:false}, 900);
    return;
  }
}

function onClick(e){
  const btn = e.target.closest("[data-action]");
  if(!btn) return;
  const action = btn.dataset.action;

  if(action==="set-tab"){ session.tab = btn.dataset.tab; saveSession(); render(); return; }
  if(action==="logout"){ logout(); return; }
  if(action==="refresh"){ location.reload(); return; }
  if(action==="dismiss-install"){ installDismissed = true; render(); return; }
  if(action==="install-app"){
    if(deferredInstallPrompt){ deferredInstallPrompt.prompt(); deferredInstallPrompt=null; }
    render();
    return;
  }
  if(action==="request-notif"){
    if(window.Notification && Notification.permission==="default"){
      Notification.requestPermission().then(()=>toast("알림 설정을 반영했어요.","ok"));
    }else if(window.Notification && Notification.permission==="granted"){
      toast("이미 브라우저 알림이 켜져 있어요.","ok");
    }else{
      toast("이 브라우저/기기에서는 알림을 지원하지 않을 수 있어요.","warn");
    }
    return;
  }
  if(action==="ack-notice") return; // handled by overlay listener

  if(action==="toggle-member-form"){ session.memberFormOpen = btn.dataset.id || null; render(); return; }
  if(action==="edit-member"){ session.memberFormOpen = btn.dataset.id; render(); return; }
  if(action==="delete-member"){
    if(btn.dataset.id===session.memberId){ toast("본인 계정은 이 화면에서 삭제할 수 없어요.","error"); return; }
    const target = appState.members.find(m=>m.id===btn.dataset.id);
    if(target && target.isMaster){ toast("마스터 관리자 계정은 삭제할 수 없어요.","error"); return; }
    showConfirm("이 회원을 삭제할까요?", ()=>{
      const s = cloneState();
      s.members = s.members.filter(m=>m.id!==btn.dataset.id);
      persist(s, {toastMsg:"회원을 삭제했어요."});
    });
    return;
  }

  if(action==="toggle-event-form"){ session.eventFormOpen = session.eventFormOpen==="new" ? false : "new"; render(); return; }
  if(action==="close-event-form"){ session.eventFormOpen = false; render(); return; }
  if(action==="edit-event"){ session.eventFormOpen = btn.dataset.id; render(); return; }
  if(action==="delete-event"){
    showConfirm("이 모임을 삭제할까요?", ()=>{
      const s = cloneState();
      s.events = s.events.filter(ev=>ev.id!==btn.dataset.id);
      if(session.eventFormOpen===btn.dataset.id) session.eventFormOpen = false;
      persist(s, {toastMsg:"모임을 삭제했어요."});
    });
    return;
  }
  if(action==="random-teams"){
    const s = cloneState();
    const ev = s.events.find(x=>x.id===btn.dataset.event);
    if(!ev || !(ev.attendance||[]).length){ toast("참석자를 먼저 체크해주세요.","error"); return; }
    const shuffled = shuffle(ev.attendance);
    const size = ev.teamSize||4;
    const teams = [];
    for(let i=0;i<shuffled.length;i+=size) teams.push(shuffled.slice(i,i+size));
    ev.teams = teams;
    const prevTimes = ev.teamTeeTimes||[];
    ev.teamTeeTimes = teams.map((_,i)=>prevTimes[i]||"");
    const prevCourses = ev.teamCourses||[];
    ev.teamCourses = teams.map((_,i)=>prevCourses[i]||"");
    persist(s, {toastMsg:"랜덤 조편성을 완료했어요."});
    return;
  }
  if(action==="remove-guest"){
    const s = cloneState();
    const ev = s.events.find(x=>x.id===btn.dataset.event);
    if(!ev) return;
    const gid = btn.dataset.guest;
    ev.guests = (ev.guests||[]).filter(g=>g.id!==gid);
    ev.attendance = (ev.attendance||[]).filter(id=>id!==gid);
    ev.teams = (ev.teams||[]).map(team=>team.filter(id=>id!==gid));
    persist(s, {toastMsg:"게스트를 제거했어요."});
    return;
  }
  if(action==="toggle-manual-teams"){
    const id = btn.dataset.event;
    session.teamMode[id] = session.teamMode[id]==="manual" ? null : "manual";
    if(session.manualTeamActive[id]===undefined) session.manualTeamActive[id] = 0;
    saveSession();
    render();
    return;
  }
  if(action==="set-manual-team-tab"){
    session.manualTeamActive[btn.dataset.event] = Number(btn.dataset.idx);
    saveSession();
    render();
    return;
  }
  if(action==="add-manual-team"){
    const s = cloneState();
    const ev = s.events.find(x=>x.id===btn.dataset.event);
    if(!ev) return;
    ev.teams = ev.teams||[];
    ev.teams.push([]);
    ev.teamTeeTimes = ev.teamTeeTimes||[];
    ev.teamTeeTimes.push("");
    ev.teamCourses = ev.teamCourses||[];
    ev.teamCourses.push("");
    session.manualTeamActive[ev.id] = ev.teams.length-1;
    saveSession();
    schedulePersist(s, {toastMsg:false}, 300);
    return;
  }
  if(action==="remove-manual-team"){
    const s = cloneState();
    const ev = s.events.find(x=>x.id===btn.dataset.event);
    if(!ev || !ev.teams || ev.teams.length<=1) return;
    const idx = Number(btn.dataset.idx);
    const removedCount = (ev.teams[idx]||[]).length;
    ev.teams = ev.teams.slice(0, idx);
    ev.teamTeeTimes = (ev.teamTeeTimes||[]).slice(0, idx);
    ev.teamCourses = (ev.teamCourses||[]).slice(0, idx);
    if((session.manualTeamActive[ev.id]||0) >= ev.teams.length) session.manualTeamActive[ev.id] = Math.max(0, ev.teams.length-1);
    saveSession();
    persist(s, {toastMsg: removedCount ? `${idx+1}조를 삭제했어요. 배정돼 있던 ${removedCount}명은 다른 조에 다시 체크해주세요.` : `${idx+1}조를 삭제했어요.`});
    return;
  }

  if(action==="toggle-dues-form"){
    session.duesFormOpen = session.duesFormOpen===btn.dataset.kind ? null : btn.dataset.kind;
    session.duesEditId = null;
    render();
    return;
  }
  if(action==="edit-dues"){
    const d = appState.dues.find(x=>x.id===btn.dataset.id);
    if(!d) return;
    session.duesEditId = d.id;
    session.duesFormOpen = d.type;
    render();
    return;
  }
  if(action==="delete-dues"){
    showConfirm("이 내역을 삭제할까요?", ()=>{
      const s = cloneState();
      s.dues = s.dues.filter(d=>d.id!==btn.dataset.id);
      if(session.duesEditId===btn.dataset.id){ session.duesEditId=null; session.duesFormOpen=null; }
      persist(s, {toastMsg:"삭제했어요."});
    });
    return;
  }

  if(action==="toggle-notice-form"){ session.noticeFormOpen = !session.noticeFormOpen; render(); return; }
  if(action==="delete-notice"){
    showConfirm("이 공지를 삭제할까요?", ()=>{
      const s = cloneState();
      s.announcements = s.announcements.filter(n=>n.id!==btn.dataset.id);
      persist(s, {toastMsg:"공지를 삭제했어요."});
    });
    return;
  }

  if(action==="shift-month"){
    const [y,m] = session.duesMonth.split("-").map(Number);
    const d = new Date(y, m-1+Number(btn.dataset.dir), 1);
    session.duesMonth = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    saveSession();
    render();
    return;
  }
  if(action==="shift-year"){
    session.duesYear = String(Number(session.duesYear)+Number(btn.dataset.dir));
    saveSession();
    render();
    return;
  }
  if(action==="shift-schedule-year"){
    session.scheduleYear = String(Number(session.scheduleYear)+Number(btn.dataset.dir));
    saveSession();
    render();
    return;
  }
  if(action==="export-schedule"){ exportScheduleCSV(btn.dataset.year); return; }
  if(action==="export-ledger"){ exportLedgerCSV(); return; }
  if(action==="export-members"){ exportMembersCSV(); return; }
  if(action==="export-backup"){ exportFullBackupJSON(); return; }
  if(action==="cancel-pin-login"){ pendingPinLogin = null; render(); return; }
  if(action==="clear-admin-pin"){
    if(!confirm("관리자 비밀번호를 삭제할까요? 이후 관리자도 이름+전화번호만으로 로그인할 수 있게 됩니다.")) return;
    const s = cloneState();
    s.club = s.club || {};
    s.club.adminPin = "";
    persist(s, {toastMsg:"관리자 비밀번호를 삭제했어요."});
    return;
  }
  if(action==="copy-notice"){
    const elId = btn.dataset.scope==="month" ? "month-notice-text" : "year-notice-text";
    const el = document.getElementById(elId);
    if(!el) return;
    el.select();
    try{
      navigator.clipboard.writeText(el.value).then(()=>toast("공지문을 복사했어요.","ok")).catch(()=>fallbackCopy(el));
    }catch(err){ fallbackCopy(el); }
    return;
  }
}
function fallbackCopy(el){
  try{ document.execCommand("copy"); toast("공지문을 복사했어요.","ok"); }
  catch(e){ toast("복사에 실패했어요. 직접 선택해 복사해주세요.","warn"); }
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  wireEvents();
  await ensureArtifactApi();
  appState = getCurrentState();
  confirmedState = appState;
  render();
  restoreScrollPosition();
  setTimeout(()=>{ if(session.memberId) checkNewNotice(); }, 400);
})();

}
AppMain();
</script>
